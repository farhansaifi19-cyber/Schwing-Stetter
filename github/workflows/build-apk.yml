
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          GRADLE_FILE=$(find project -name gradlew -type f | head -n 1)
          test -n "$GRADLE_FILE"
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Schwing-Stetter-Mohali-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
